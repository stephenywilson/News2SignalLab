name: Smoke Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    name: Smoke Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, no external dependencies)
        run: python -m pip install -e .

      - name: Verify CLI help
        run: python -m news2signallab --help

      - name: Run demo pipeline
        run: python -m news2signallab demo

      - name: Run smoke test
        run: bash scripts/smoke_test.sh
